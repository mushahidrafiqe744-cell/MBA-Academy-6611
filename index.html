<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBA Academy</title>
    <meta name="description" content="All-in-One Tuition Academy Management System with Supabase backend and student portals" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }

      #academy-loader {
        position: fixed;
        inset: 0;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 999999;
        background: #06152f;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s ease;
        overflow: hidden !important;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
      }

      /* Full Screen Toggle Button on Top Right */
      .loader-fullscreen-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000000;
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 9999px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        transition: all 0.25s ease;
      }

      .loader-fullscreen-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #ffffff;
        transform: scale(1.05);
      }

      /* Campus Background Layer - strictly contained, full screen cover, no overflow or scrollbars */
      .loader-bg-image {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        background-image: url('/campus-bg.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        pointer-events: none;
      }

      .loader-bg-overlay {
        display: none;
      }

      #academy-loader.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-content {
        text-align: center;
        animation: enter 1s cubic-bezier(0.16, 1, 0.3, 1);
        padding: 24px;
        max-width: 520px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }

      /* Bismillah Top Section */
      .bismillah-wrapper {
        margin-bottom: 18px;
        padding: 12px 24px;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.1);
        position: relative;
        width: 100%;
        max-width: 440px;
      }

      .bismillah-corner-tl, .bismillah-corner-tr, .bismillah-corner-bl, .bismillah-corner-br {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: #ffffff;
        border-style: solid;
      }
      .bismillah-corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 18px; }
      .bismillah-corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 18px; }
      .bismillah-corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 18px; }
      .bismillah-corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 18px; }

      .bismillah-arabic {
        direction: rtl;
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', Georgia, serif;
        font-size: 32px;
        line-height: 1.4;
        color: #ffffff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.9), 0 3px 10px rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 4px 0;
      }

      .bismillah-word {
        opacity: 0;
        display: inline-block;
        transform: translateY(-8px) scale(0.9);
        animation: wordFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .bismillah-word:nth-child(1) { animation-delay: 0.2s; }
      .bismillah-word:nth-child(2) { animation-delay: 0.7s; }
      .bismillah-word:nth-child(3) { animation-delay: 1.2s; }
      .bismillah-word:nth-child(4) { animation-delay: 1.7s; }

      @keyframes wordFadeIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .academy-logo {
        width: 155px;
        height: 155px;
        object-fit: contain;
        animation: logoPulse 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.5)) drop-shadow(0 4px 15px rgba(0, 0, 0, 0.7));
        margin: 0 auto 8px;
        display: block;
        border-radius: 50%;
      }

      .loader-content h1 {
        margin: 8px 0 3px;
        color: #ffffff;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 4px;
        font-family: Georgia, serif;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.4);
      }

      .loader-content p {
        color: #ffffff;
        font-size: 15px;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 2px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }

      .loader-bar {
        width: 280px;
        height: 4px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        margin: 18px auto 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(0, 0, 0, 0.5);
      }

      .loader-bar span {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #ffffff, #e2e8f0, #ffffff);
        box-shadow: 0 0 12px #ffffff;
        animation: progress 10s linear forwards;
      }

      .loading-subtext {
        color: #ffffff;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 700;
        margin-top: 4px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }

      @keyframes progress {
        to { width: 100%; }
      }

      @keyframes logoPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4)) drop-shadow(0 4px 15px rgba(0, 0, 0, 0.7)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 32px rgba(255, 255, 255, 0.7)) drop-shadow(0 6px 20px rgba(0, 0, 0, 0.8)); }
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media(max-width: 600px) {
        .bismillah-arabic {
          font-size: 24px;
          gap: 8px;
        }

        .academy-logo {
          width: 125px;
          height: 125px;
        }

        .loader-content h1 {
          font-size: 24px;
          letter-spacing: 3px;
        }

        .loader-content p {
          font-size: 13px;
        }

        .loader-bar {
          width: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div id="academy-loader">
      <!-- Campus Background Image & Blur Overlay -->
      <div class="loader-bg-image"></div>
      <div class="loader-bg-overlay"></div>

      <!-- Full Screen Toggle Button -->
      <button 
        type="button" 
        id="loader-fullscreen-btn" 
        onclick="toggleAppFullscreen(event)" 
        class="loader-fullscreen-btn"
        title="Toggle Full Screen Mode"
      >
        <svg id="fs-icon-expand" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <svg id="fs-icon-shrink" style="display: none;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
        </svg>
        <span id="fs-label">Full Screen</span>
      </button>

      <div class="loader-content" onclick="dismissAcademyLoader()">
        <!-- Bismillah Header (Sab Se Top Par Word by Word Animation) -->
        <div class="bismillah-wrapper">
          <div class="bismillah-corner-tl"></div>
          <div class="bismillah-corner-tr"></div>
          <div class="bismillah-corner-bl"></div>
          <div class="bismillah-corner-br"></div>
          <div class="bismillah-arabic" lang="ar">
            <span class="bismillah-word">بِسْمِ</span>
            <span class="bismillah-word">اللهِ</span>
            <span class="bismillah-word">الرَّحْمٰنِ</span>
            <span class="bismillah-word">الرَّحِيْمِ</span>
          </div>
        </div>

        <img 
          src="/logo.png" 
          onerror="this.onerror=null; this.src='/logo.jpg';" 
          class="academy-logo" 
          alt="MBA Academy Official Logo"
        />

        <h1>MBA ACADEMY</h1>
        <p>Quality Education for Bright Future</p>

        <div class="loader-bar">
          <span></span>
        </div>

        <div class="loading-subtext">WELCOME TO MBA ACADEMY</div>

        <!-- Direct Login Page Button on Welcome Screen -->
        <div style="margin-top: 18px; display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap;" onclick="event.stopPropagation()">
          <button 
            type="button" 
            onclick="openAcademyLoginPage(event)" 
            style="background: linear-gradient(135deg, #2563eb, #1e40af); color: #ffffff; border: 1.5px solid rgba(255,255,255,0.5); padding: 10px 24px; border-radius: 9999px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.35); transition: all 0.2s;"
          >
            🔑 Log In / Sign Up Page
          </button>
          <button 
            type="button" 
            onclick="dismissAcademyLoader(event)" 
            style="background: rgba(0,0,0,0.5); color: #ffffff; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 9999px; font-weight: 700; font-size: 12px; cursor: pointer;"
          >
            🌐 Open Website
          </button>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      let isLoaderDismissed = false;

      function openAcademyLoginPage(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        window.location.hash = 'login';
        dismissAcademyLoader();
      }

      function dismissAcademyLoader(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        if (isLoaderDismissed) return;
        isLoaderDismissed = true;
        const loader = document.getElementById("academy-loader");
        if (loader) {
          loader.classList.add("hide");
          setTimeout(() => {
            loader.style.display = "none";
          }, 850);
        }
      }

      function toggleAppFullscreen(e) {
        if (e && e.stopPropagation) {
          e.stopPropagation();
        }
        const doc = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (doc.requestFullscreen) {
            doc.requestFullscreen().catch(() => {});
          } else if (doc.webkitRequestFullscreen) {
            doc.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      }

      function updateFsBtnState() {
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        const iconExpand = document.getElementById("fs-icon-expand");
        const iconShrink = document.getElementById("fs-icon-shrink");
        const label = document.getElementById("fs-label");
        if (iconExpand && iconShrink && label) {
          iconExpand.style.display = isFs ? "none" : "inline-block";
          iconShrink.style.display = isFs ? "inline-block" : "none";
          label.textContent = isFs ? "Exit Full Screen" : "Full Screen";
        }
      }

      document.addEventListener("fullscreenchange", updateFsBtnState);
      document.addEventListener("webkitfullscreenchange", updateFsBtnState);

      // Automatically open website after exactly 10 seconds, directing to login if not logged in
      setTimeout(() => {
        if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#home') {
          // If user didn't explicitly pick home, show login page
          const hasUser = localStorage.getItem('ta_current_user_v1');
          if (!hasUser) {
            window.location.hash = 'login';
          }
        }
        dismissAcademyLoader();
      }, 10000);
    </script>
  </body>
</html>
